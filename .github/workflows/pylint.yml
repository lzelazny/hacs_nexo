name: Pylint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install lint and runtime dependencies
        run: python -m pip install pylint==4.1.3 homeassistant websocket-client
      - name: Lint integration
        run: python -m pylint custom_components/nexo
